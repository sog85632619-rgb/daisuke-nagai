<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボタンライトゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ボタンライトゲーム</h1>
        <p class="instruction">ボタンを押してみよう！10回に1回光るよ！</p>
        <button id="gameButton" class="game-button">押してね！</button>
        <div class="stats">
            <p>押した回数: <span id="clickCount">0</span></p>
            <p>光った回数: <span id="lightCount">0</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
