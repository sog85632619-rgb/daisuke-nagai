<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基板見積もり → 稟議上申資料 自動生成</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
    }

    header {
      background: #1a365d;
      color: white;
      padding: 20px 32px;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header p { font-size: 13px; color: #a0aec0; margin-top: 4px; }

    .main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
      display: grid;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .card h2 {
      font-size: 15px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }
    .form-row { margin-bottom: 16px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    input[type="text"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
      background: #f7fafc;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4299e1;
      background: white;
    }
    textarea { resize: vertical; min-height: 70px; }

    .api-key-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .api-key-row input { flex: 1; }

    .upload-area {
      border: 2px dashed #cbd5e0;
      border-radius: 10px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #f7fafc;
    }
    .upload-area:hover, .upload-area.drag-over {
      border-color: #4299e1;
      background: #ebf8ff;
    }
    .upload-area .icon { font-size: 40px; margin-bottom: 10px; }
    .upload-area p { color: #718096; font-size: 14px; }
    .upload-area p strong { color: #4299e1; }
    .upload-area input[type="file"] { display: none; }
    .file-name {
      margin-top: 10px;
      font-size: 13px;
      color: #2d3748;
      font-weight: 600;
      display: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #3182ce;
      color: white;
      width: 100%;
      justify-content: center;
      font-size: 16px;
      padding: 14px;
    }
    .btn-primary:hover { background: #2b6cb0; }
    .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
      background: #edf2f7;
      color: #4a5568;
    }
    .btn-sm:hover { background: #e2e8f0; }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.loading { background: #ebf8ff; color: #2b6cb0; display: flex; }
    .status.error { background: #fff5f5; color: #c53030; display: flex; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #bee3f8;
      border-top-color: #3182ce;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 稟議書出力エリア */
    #output-section { display: none; }

    .approval-doc {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 32px;
      background: white;
      font-size: 14px;
      line-height: 1.8;
    }
    .approval-doc h3 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 4px;
    }
    .approval-doc table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    .approval-doc table td, .approval-doc table th {
      border: 1px solid #cbd5e0;
      padding: 8px 12px;
      vertical-align: top;
    }
    .approval-doc table th {
      background: #f7fafc;
      font-weight: 600;
      width: 140px;
      white-space: nowrap;
    }
    .approval-doc .section-title {
      font-weight: 700;
      margin: 20px 0 8px;
      font-size: 14px;
      border-left: 4px solid #3182ce;
      padding-left: 8px;
    }
    .approval-doc .amount {
      font-size: 20px;
      font-weight: 700;
      color: #c53030;
      text-align: center;
      padding: 12px;
      background: #fff5f5;
      border-radius: 6px;
      margin: 12px 0;
    }
    .approval-doc .sign-area {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }
    .approval-doc .sign-box {
      border: 1px solid #cbd5e0;
      padding: 8px;
      text-align: center;
      min-height: 70px;
    }
    .approval-doc .sign-box .sign-label {
      font-size: 12px;
      color: #718096;
      margin-bottom: 4px;
    }

    .btn-print {
      background: #276749;
      color: white;
    }
    .btn-print:hover { background: #22543d; }

    .output-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    @media print {
      header, .card:not(#output-section .card), .output-actions { display: none !important; }
      #output-section { display: block !important; }
      .approval-doc { border: none; padding: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>基板見積もり → 稟議上申資料 自動生成</h1>
  <p>見積もりPDFをアップロードすると、稟議書を自動で作成します</p>
</header>

<div class="main">

  <!-- API設定 -->
  <div class="card">
    <h2>Claude APIキー設定</h2>
    <div class="form-row">
      <label>APIキー <span style="color:#718096; font-weight:400;">（Anthropicで発行したもの）</span></label>
      <div class="api-key-row">
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
        <button class="btn btn-sm" onclick="saveApiKey()">保存</button>
        <button class="btn btn-sm" onclick="clearApiKey()">削除</button>
      </div>
      <p id="apiKeyStatus" style="margin-top:6px; font-size:12px; color:#718096;"></p>
    </div>
  </div>

  <!-- ファイルアップロード -->
  <div class="card">
    <h2>見積もりPDFのアップロード</h2>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('pdfInput').click()">
      <div class="icon">📄</div>
      <p><strong>クリックしてPDFを選択</strong></p>
      <p style="margin-top:4px; font-size:12px;">またはここにドラッグ＆ドロップ</p>
      <input type="file" id="pdfInput" accept=".pdf" onchange="handleFile(this.files[0])">
      <div class="file-name" id="fileName"></div>
    </div>
  </div>

  <!-- 補足情報 -->
  <div class="card">
    <h2>稟議書の補足情報</h2>
    <div class="form-grid">
      <div class="form-row">
        <label>申請部署</label>
        <input type="text" id="dept" placeholder="例：開発部">
      </div>
      <div class="form-row">
        <label>申請者名</label>
        <input type="text" id="applicant" placeholder="例：山田 太郎">
      </div>
      <div class="form-row">
        <label>申請日</label>
        <input type="text" id="appDate" placeholder="例：2026年4月5日">
      </div>
      <div class="form-row">
        <label>希望納期</label>
        <input type="text" id="deadline" placeholder="例：2026年6月末">
      </div>
    </div>
    <div class="form-row">
      <label>使用目的・背景</label>
      <textarea id="purpose" placeholder="例：新製品○○の試作評価用基板。量産に向けた動作確認のため発注が必要。"></textarea>
    </div>
    <div class="form-row">
      <label>その他・特記事項</label>
      <textarea id="notes" placeholder="例：複数社から見積もりを取得し、品質・価格面から当社を選定した。"></textarea>
    </div>
  </div>

  <!-- 生成ボタン -->
  <button class="btn btn-primary" id="generateBtn" onclick="generate()">
    稟議書を自動生成する
  </button>

  <div class="status" id="status">
    <div class="spinner"></div>
    <span id="statusText">見積もりを解析中...</span>
  </div>

  <!-- 出力 -->
  <div id="output-section">
    <div class="card">
      <h2>生成された稟議上申資料</h2>
      <div class="approval-doc" id="approvalDoc"></div>
      <div class="output-actions">
        <button class="btn btn-sm btn-print" onclick="window.print()">印刷 / PDF保存</button>
        <button class="btn btn-sm" onclick="copyText()">テキストコピー</button>
      </div>
    </div>
  </div>

</div>

<script>
let selectedFile = null;

// APIキー管理
window.onload = () => {
  const saved = localStorage.getItem('claude_api_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
    document.getElementById('apiKeyStatus').textContent = 'APIキーが保存されています';
  }
  // 今日の日付をデフォルト設定
  const today = new Date();
  document.getElementById('appDate').value =
    `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;

  setupDragDrop();
};

function saveApiKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) return;
  localStorage.setItem('claude_api_key', key);
  document.getElementById('apiKeyStatus').textContent = '保存しました';
}

function clearApiKey() {
  localStorage.removeItem('claude_api_key');
  document.getElementById('apiKey').value = '';
  document.getElementById('apiKeyStatus').textContent = '削除しました';
}

// ファイル処理
function handleFile(file) {
  if (!file || file.type !== 'application/pdf') {
    alert('PDFファイルを選択してください');
    return;
  }
  selectedFile = file;
  const nameEl = document.getElementById('fileName');
  nameEl.textContent = `選択済み: ${file.name}`;
  nameEl.style.display = 'block';
  document.getElementById('uploadArea').style.borderColor = '#48bb78';
}

function setupDragDrop() {
  const area = document.getElementById('uploadArea');
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('drag-over'); });
  area.addEventListener('dragleave', () => area.classList.remove('drag-over'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    area.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });
}

// PDF → base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const b64 = reader.result.split(',')[1];
      resolve(b64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 稟議書生成
async function generate() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { alert('APIキーを入力してください'); return; }
  if (!selectedFile) { alert('PDFファイルを選択してください'); return; }

  const dept = document.getElementById('dept').value || '（未入力）';
  const applicant = document.getElementById('applicant').value || '（未入力）';
  const appDate = document.getElementById('appDate').value || '（未入力）';
  const deadline = document.getElementById('deadline').value || '（未入力）';
  const purpose = document.getElementById('purpose').value || '（未入力）';
  const notes = document.getElementById('notes').value || '（なし）';

  setLoading(true, '見積もりPDFを解析中...');

  try {
    const pdfBase64 = await fileToBase64(selectedFile);

    const prompt = `あなたは日本の製造業の購買・経理担当者です。
添付された基板（プリント基板/PCB）の見積もりPDFを読み取り、以下の情報を抽出してください。

【抽出する情報】
- 発注先（仕入先）会社名
- 見積番号・見積日
- 基板の品名・型番・仕様（層数、サイズ、表面処理など）
- 数量と単位
- 単価
- 合計金額（税抜き・税込み）
- 納期
- 備考・特記事項

次に、以下の補足情報と組み合わせて、社内稟議上申資料のHTMLを生成してください。

【補足情報】
- 申請部署: ${dept}
- 申請者: ${applicant}
- 申請日: ${appDate}
- 希望納期: ${deadline}
- 使用目的・背景: ${purpose}
- 特記事項: ${notes}

【出力形式】
以下の構成でHTMLを出力してください。CSSクラスはapproval-doc内で定義済みのものを使ってください。
Markdownのコードブロック（\`\`\`）は不要です。HTMLタグのみ出力してください。

出力するHTMLの構成:
1. <h3>稟 議 上 申 書</h3>
2. 承認欄テーブル（sign-area/sign-box）: 「役員」「部長」「課長」「担当」の4列
3. 基本情報テーブル（申請日、申請部署、申請者、件名）
4. 発注内容セクション: 発注先、見積番号、品名・仕様テーブル、合計金額（amountクラス）
5. 申請理由・目的セクション
6. 経緯・選定理由セクション
7. 特記事項セクション

注意: 金額は税抜き・消費税・税込みを明記してください。PDFから読み取れない項目は「（要確認）」と記載してください。`;

    setLoading(true, 'Claude AIが稟議書を作成中...');

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-calls': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4096,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'document',
              source: {
                type: 'base64',
                media_type: 'application/pdf',
                data: pdfBase64
              }
            },
            {
              type: 'text',
              text: prompt
            }
          ]
        }]
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `APIエラー: ${response.status}`);
    }

    const data = await response.json();
    const html = data.content[0].text
      .replace(/```html\n?/g, '')
      .replace(/```\n?/g, '')
      .trim();

    document.getElementById('approvalDoc').innerHTML = html;
    document.getElementById('output-section').style.display = 'block';
    document.getElementById('output-section').scrollIntoView({ behavior: 'smooth' });
    setLoading(false);

  } catch (e) {
    setLoading(false, null, e.message);
  }
}

function setLoading(loading, text, error) {
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('generateBtn');

  if (loading) {
    statusEl.className = 'status loading';
    document.getElementById('statusText').textContent = text;
    btn.disabled = true;
  } else if (error) {
    statusEl.className = 'status error';
    document.getElementById('statusText').textContent = 'エラー: ' + error;
    btn.disabled = false;
  } else {
    statusEl.style.display = 'none';
    statusEl.className = 'status';
    btn.disabled = false;
  }
}

function copyText() {
  const doc = document.getElementById('approvalDoc');
  navigator.clipboard.writeText(doc.innerText).then(() => alert('コピーしました'));
}
</script>
</body>
</html>
