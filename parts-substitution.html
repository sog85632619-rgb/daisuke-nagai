<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子部品 代替品検索システム</title>
    <link rel="stylesheet" href="parts-substitution.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1>⚡ 電子部品 代替品検索システム</h1>
            <p class="subtitle">部品番号またはスペックを入力して代替品を検索</p>
        </div>
    </header>

    <main class="main">
        <!-- 検索パネル -->
        <section class="search-panel">
            <div class="search-row">
                <div class="input-group">
                    <label for="partNumber">部品番号 / 型番</label>
                    <input type="text" id="partNumber" placeholder="例: LM358, 100nF, 10kΩ" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="category">カテゴリ</label>
                    <select id="category">
                        <option value="">すべて</option>
                        <option value="ic">IC / オペアンプ</option>
                        <option value="resistor">抵抗</option>
                        <option value="capacitor">コンデンサ</option>
                        <option value="transistor">トランジスタ</option>
                        <option value="diode">ダイオード</option>
                        <option value="mosfet">MOSFET</option>
                    </select>
                </div>
                <button id="searchBtn" class="btn btn-primary">🔍 検索</button>
            </div>

            <div class="spec-filters" id="specFilters">
                <h3>スペック絞り込み</h3>
                <div class="filter-row">
                    <div class="input-group">
                        <label for="voltageMax">最大電圧 (V) 以上</label>
                        <input type="number" id="voltageMax" placeholder="例: 12" step="0.1">
                    </div>
                    <div class="input-group">
                        <label for="currentMax">最大電流 (A) 以上</label>
                        <input type="number" id="currentMax" placeholder="例: 0.5" step="0.01">
                    </div>
                    <div class="input-group">
                        <label for="tempRange">動作温度 (℃) 以下</label>
                        <input type="number" id="tempRange" placeholder="例: 85" step="1">
                    </div>
                    <div class="input-group">
                        <label for="package">パッケージ</label>
                        <select id="package">
                            <option value="">すべて</option>
                            <option value="DIP">DIP</option>
                            <option value="SOP">SOP</option>
                            <option value="SOT-23">SOT-23</option>
                            <option value="TO-92">TO-92</option>
                            <option value="TO-220">TO-220</option>
                            <option value="0402">0402</option>
                            <option value="0603">0603</option>
                            <option value="0805">0805</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- 結果エリア -->
        <section class="results-section" id="resultsSection" style="display:none">
            <div class="results-header">
                <h2>検索結果</h2>
                <div class="results-meta">
                    <span id="resultCount">0件</span>
                    <button class="btn btn-secondary" id="exportBtn">📥 CSV出力</button>
                </div>
            </div>

            <!-- 元の部品情報 -->
            <div class="original-part-card" id="originalPartCard" style="display:none">
                <h3>🔎 元の部品</h3>
                <div id="originalPartInfo"></div>
            </div>

            <!-- 代替品リスト -->
            <div id="substituteList" class="substitute-list"></div>
        </section>

        <!-- 空状態 -->
        <section class="empty-state" id="emptyState">
            <div class="empty-icon">🔧</div>
            <h2>部品番号を入力して検索してください</h2>
            <p>部品番号、抵抗値、容量値などで検索できます。</p>
            <div class="quick-searches">
                <p>クイック検索:</p>
                <button class="chip" data-query="LM358">LM358</button>
                <button class="chip" data-query="NE555">NE555</button>
                <button class="chip" data-query="2SC1815">2SC1815</button>
                <button class="chip" data-query="1N4007">1N4007</button>
                <button class="chip" data-query="100nF">100nF</button>
                <button class="chip" data-query="10kΩ">10kΩ</button>
            </div>
        </section>

        <!-- ローディング -->
        <section class="loading" id="loading" style="display:none">
            <div class="spinner"></div>
            <p>代替品を検索中...</p>
        </section>

        <!-- 見つからない場合 -->
        <section class="not-found" id="notFound" style="display:none">
            <div class="not-found-icon">😕</div>
            <h2>代替品が見つかりませんでした</h2>
            <p>別のキーワードやスペックで再検索してください。</p>
        </section>
    </main>

    <!-- 部品詳細モーダル -->
    <div class="modal-overlay" id="modalOverlay" style="display:none">
        <div class="modal" id="partModal">
            <button class="modal-close" id="modalClose">✕</button>
            <h2 id="modalTitle"></h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="parts-substitution.js"></script>
</body>
</html>
